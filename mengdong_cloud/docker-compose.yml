version: "3.8"

services:
  mengdong-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: mengdong_cloud:latest
    container_name: mengdong_cloud
    restart: unless-stopped
    ports:
      - "22266:22266"
    volumes:
      - ./models:/app/models        # 模型文件挂载
      - ./output:/app/output         # 输出视频挂载
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=22266
      - PLATFORM_HOST=http://host.docker.internal:8080
      - KEEPALIVE_INTERVAL=30
      - DEVICE=0
      - CONFIDENCE_THRESHOLD=0.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://localhost:22266/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
